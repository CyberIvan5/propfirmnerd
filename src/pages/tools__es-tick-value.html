<header class="art-head"><h1>ES tick value</h1></header>
<div class="content"><p class="lede">One ES tick (0.25 index points) is worth $12.50, and one full point is worth $50. The micro version, MES, is one tenth of that: $1.25 a tick and $5 a point.</p></div>
<form class="tool" data-tool="tick" data-preset="ES">
<div class="grid">
<label>Contract<select name="symbol"></select></label>
<label>Contracts<input name="qty" type="number" min="1" step="1" value="1" inputmode="numeric"></label>
<label>Move in ticks<input name="ticks" type="number" step="1" value="8" inputmode="numeric"></label>
</div>
<div class="result">
<div>Tick size<b data-out="size">—</b></div>
<div>Value of one tick<b data-out="tick">—</b></div>
<div>Value of one point<b data-out="point">—</b></div>
<div>Your move (<span data-out="pts"></span>)<b data-out="move">—</b></div>
</div>
</form>
<script>window.PFN_CONTRACTS={{CONTRACTS_JSON}};</script>
<div class="content"><h2>ES vs MES</h2>{{CONTRACT_TABLE:ES,MES,NQ,MNQ}}</div>
